name: Webhooks

on:
  push:
    branches:
      - 'pact-webhooks-temp'
  workflow_dispatch:
    inputs:
      provider_name:
        description: provider_name
        required: true
        type: string

env:
  hmpps-person-record: 'ctNyAoj2Rx6pJYuJSpYChw'

jobs:
  apply_webhooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.INTEGRATION_TESTS_TRIGGER_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_TESTS_TRIGGER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          repositories: hmpps-person-record
      - name: Run integration tests
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatch({
              owner: context.repo.owner,
              repo: 'hmpps-person-record',
              event_type: 'pact_changed',
              client_payload: {
                consumerName: 'hmpps-single-accommodation-service-api',
                consumerBranch: 'main',
                providerAppVersion: '2026-10-16.5917.4a4e800',
                providerBranch: 'refs/heads/feat/setup-provider-webhook',
                providerTag: ['4a4e80027f95ceac462206e150ccf5ad271c911a']
              }
            })
