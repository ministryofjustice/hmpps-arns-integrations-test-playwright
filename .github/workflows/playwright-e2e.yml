name: Playwright E2E Tests
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run tests'
        required: false
        default: 'dev'
        type: string
      source:
        description: 'Repo triggering tests'
        required: false
        default: 'all'
        type: string
      directory:
        description: 'Directory'
        required: false
        default: './e2e-tests'
        type: string

jobs:
  test:
    runs-on: [ self-hosted, hmpps-github-actions-runner ]
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ inputs.directory }}
      - name: Install playwright
        run: npx playwright install
        working-directory: ${{ inputs.directory }}
      - name: Run Playwright tests
        id: playwright-tests
        run: npm run ${{ inputs.environment }}:${{ inputs.source }}:ci
        working-directory: ${{ inputs.directory }}
        env:
          AAP_CLIENT_ID: ${{ secrets.AAP_CLIENT_ID }}
          AAP_CLIENT_SECRET: ${{ secrets.AAP_CLIENT_SECRET }}
          ARNS_ASSESSMENT_CLIENT_ID: ${{ secrets.VIEW_API_CLIENT_ID }}
          ARNS_ASSESSMENT_CLIENT_SECRET: ${{ secrets.VIEW_API_CLIENT_SECRET }}
          # URLs
          TOKEN_URL: ${{ secrets.TOKEN_URL }}
          # Credentials
          MPOP_USERNAME: ${{ secrets.E2E_MPOP_USERNAME }}
          DELIUS_PASSWORD: ${{ secrets.E2E_DELIUS_PASSWORD }}

      - name: Publish Test Summary
        uses: ctrf-io/github-test-reporter@7974087018bf4857cf5a9d78723e152038c3fa31
        with:
          report-path: '${{ inputs.directory }}/ctrf/ctrf-report.json'
        if: always()
      
      - name: Archive screenshots & trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: screenshots-playwright
          path: |
            ${{ inputs.directory }}/test-results/**/*
