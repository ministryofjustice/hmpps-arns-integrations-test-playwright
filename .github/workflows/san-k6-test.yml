name: Performance UI Tests
on:
  workflow_call:
    inputs:
      ui_name:
        description: 'UI performance test name to run'
        required: false
        default: 'san'
        type: string

jobs:
  k6_test:
    name: ${{ inputs.ui_name }} ui perf
    runs-on: [ self-hosted, hmpps-github-actions-runner ]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1

      - name: Run k6 ${{ inputs.ui_name }} UI perf test
        env:
          # Environment variables for the Web Dashboard
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: "${{ inputs.ui_name }}-ui-report.html"

        run: k6 run performance/tests/${{ inputs.ui_name }}-ui-smoke.js

      - name: Upload ${{ inputs.ui_name }} UI Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: k6-ui-${{ inputs.ui_name }}-report
          path: ${{ inputs.ui_name }}-ui-report.html
          retention-days: 1
