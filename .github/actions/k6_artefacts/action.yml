name: 'k6 artefacts'
description: 'k6 upload artefacts'
inputs:
  ui_name:
    description: "ui name"
    required: false
    default: 'san'

runs:
  using: "composite"
  steps:
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d
      if: always()
      with:
        report_paths: '**/junit.xml'

    - name: Upload ${{ inputs.ui_name }} performance html report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: k6-${{ inputs.ui_name }}-report-html
        path: result.html
